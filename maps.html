<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Map with GPS location and place search for Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<title>Maps on Glasses</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:600px;height:600px;background:#000;color:#e8e8e8;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#map{width:600px;height:600px;background:#000;outline:none}
#map.focused{box-shadow:inset 0 0 0 3px #00d4ff}
.panel{position:absolute;top:12px;left:12px;right:12px;z-index:1000}
.row{display:flex;gap:8px}
input[type=text]{flex:1;background:rgba(10,10,10,.92);border:2px solid #333;border-radius:12px;color:#e8e8e8;font-size:20px;padding:12px;font-family:inherit}
input[type=text].focused{border-color:#00d4ff;outline:none}
.btn{background:rgba(10,10,10,.92);border:2px solid #333;border-radius:12px;color:#e8e8e8;font-size:20px;padding:12px 16px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.focused{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,.4);outline:none}
#results{margin-top:8px;max-height:300px;overflow:hidden}
.res{display:block;width:100%;background:rgba(10,10,10,.94);border:2px solid transparent;border-radius:12px;color:#e8e8e8;font-size:18px;padding:12px;margin-bottom:8px;text-align:left;cursor:pointer;font-family:inherit;line-height:1.3}
.res.focused{border-color:#00d4ff;outline:none}
.corner{position:absolute;z-index:1000;display:flex;flex-direction:column;gap:8px}
#zoomctl{right:12px;bottom:64px}
#locctl{left:12px;bottom:64px}
.corner .btn{font-size:24px;padding:12px 18px}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:#777!important;font-size:10px!important}
.leaflet-control-attribution a{color:#777!important}
.leaflet-control-zoom{display:none}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(10,10,10,.92);border:1px solid #333;border-radius:10px;padding:10px 18px;font-size:16px;color:#cfcfcf;z-index:1001;display:none;white-space:nowrap}
</style>
</head>
<body>
<div class="panel">
  <div class="row">
    <input type="text" id="q" class="focusable" placeholder="Search places..." autocomplete="off">
    <button class="btn focusable" id="go">Go</button>
  </div>
  <div id="results"></div>
</div>
<div id="map" class="focusable" tabindex="0"></div>
<div class="corner" id="zoomctl">
  <button class="btn focusable" id="zin">+</button>
  <button class="btn focusable" id="zout">&minus;</button>
</div>
<div class="corner" id="locctl">
  <button class="btn focusable" id="loc">&#9678; Me</button>
</div>
<div id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map=L.map('map',{zoomControl:false,attributionControl:true}).setView([37.77,-122.41],12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
var meMarker=null,searchMarker=null;
var items=[],idx=0;
function collect(){items=[...document.querySelectorAll('.focusable')];}
function f(n){if(!items.length)return;idx=(n+items.length)%items.length;items.forEach(function(el,k){el.classList.toggle('focused',k===idx)});items[idx].focus({preventScroll:true});}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},2500);}
document.addEventListener('keydown',function(e){
  var tag=(document.activeElement&&document.activeElement.tagName)||'';
  var onMap=document.activeElement&&document.activeElement.id==='map';
  if(e.key==='Escape'){
    if(tag==='INPUT'){document.activeElement.blur();collect();f(0);}
    else{history.back();}
    return;
  }
  if(tag==='INPUT'){ if(e.key==='Enter'){e.preventDefault();doSearch();} return; }
  if(onMap&&(e.key==='ArrowUp'||e.key==='ArrowDown'||e.key==='ArrowLeft'||e.key==='ArrowRight')){
    e.preventDefault();
    var p=110;
    if(e.key==='ArrowUp')map.panBy([0,-p]);
    if(e.key==='ArrowDown')map.panBy([0,p]);
    if(e.key==='ArrowLeft')map.panBy([-p,0]);
    if(e.key==='ArrowRight')map.panBy([p,0]);
    return;
  }
  if(onMap&&(e.key==='+'||e.key==='=')){map.zoomIn();return;}
  if(onMap&&(e.key==='-'||e.key==='_')){map.zoomOut();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();f(idx+1);}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();f(idx-1);}
  else if(e.key==='Enter'){e.preventDefault();if(items[idx])items[idx].click();}
});
document.getElementById('zin').addEventListener('click',function(){map.zoomIn();});
document.getElementById('zout').addEventListener('click',function(){map.zoomOut();});
document.getElementById('loc').addEventListener('click',locate);
document.getElementById('go').addEventListener('click',doSearch);
function locate(){
  if(!navigator.geolocation){toast('No GPS available');return;}
  toast('Finding you...');
  navigator.geolocation.getCurrentPosition(function(pos){
    var ll=[pos.coords.latitude,pos.coords.longitude];
    map.setView(ll,15);
    if(meMarker)map.removeLayer(meMarker);
    meMarker=L.circleMarker(ll,{radius:9,color:'#00d4ff',fillColor:'#00d4ff',fillOpacity:.9}).addTo(map).bindTooltip('You');
    toast('Found you');
  },function(){toast('Location blocked or unavailable');},{timeout:12000});
}
function doSearch(){
  var q=document.getElementById('q').value.trim();
  if(!q)return;
  var box=document.getElementById('results');
  box.innerHTML='';
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}})
  .then(function(r){return r.json()}).then(function(d){
    if(!d.length){toast('No places found');return;}
    d.forEach(function(p){
      var b=document.createElement('button');
      b.className='res focusable';
      b.textContent=p.display_name.split(',').slice(0,3).join(',');
      b.addEventListener('click',function(){
        var ll=[parseFloat(p.lat),parseFloat(p.lon)];
        map.setView(ll,15);
        if(searchMarker)map.removeLayer(searchMarker);
        searchMarker=L.marker(ll).addTo(map).bindTooltip(p.display_name.split(',')[0]).openTooltip();
        box.innerHTML='';collect();f(2);
      });
      box.appendChild(b);
    });
    collect();f(2);
  }).catch(function(){toast('Search failed');});
}
collect();f(2); // start focused on the map
setTimeout(locate,1500);
</script>
</body>
</html>
