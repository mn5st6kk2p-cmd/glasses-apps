<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Dan's glasses app launcher">
<meta name="mrbd-web-app-capable" content="yes">
<title>Dan's Glasses Apps</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:600px;height:600px;background:#000;color:#e8e8e8;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
.wrap{padding:36px 32px}
h1{font-size:42px;margin:0 0 6px}
.sub{color:#9a9a9a;font-size:20px;margin-bottom:30px}
.btn{display:block;width:100%;margin:0 0 18px;padding:24px;background:#161616;border:2px solid transparent;border-radius:16px;color:#e8e8e8;font-size:28px;text-align:left;cursor:pointer;font-family:inherit}
.btn small{display:block;color:#9a9a9a;font-size:18px;margin-top:6px}
.btn.focused{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,.4);outline:none}
.hint{color:#9a9a9a;font-size:16px;margin-top:26px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1>Dan's Apps</h1>
<div class="sub">Pick an app, press Enter</div>
<button class="btn focusable" data-go="youtube.html">&#9654; YouTube<small>Search &amp; play videos in-lens</small></button>
<button class="btn focusable" data-go="maps.html">&#128506; Maps<small>Map, GPS location, place search</small></button>
<button class="btn focusable" data-go="facebook.html">&#128214; Facebook<small>Quick links (login required)</small></button>
<div class="hint">Neural Band: swipe = move &middot; pinch = select<br>ESC = back</div>
</div>
<script>
var items=[...document.querySelectorAll('.focusable')],i=0;
function f(n){i=(n+items.length)%items.length;items.forEach(function(el,k){el.classList.toggle('focused',k===i)});items[i].focus({preventScroll:true});}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();f(i+1);}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();f(i-1);}
  else if(e.key==='Enter'){e.preventDefault();items[i].click();}
});
items.forEach(function(b){b.addEventListener('click',function(){location.href=b.dataset.go+location.hash;});});
f(0);
</script>
</body>
</html>
