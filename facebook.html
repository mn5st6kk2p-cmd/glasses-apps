<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="Facebook quick links for Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<title>Facebook on Glasses</title>
<link rel="icon" href="https://www.facebook.com/favicon.ico">
<link rel="apple-touch-icon" href="https://www.facebook.com/favicon.ico">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:600px;height:600px;background:#000;color:#e8e8e8;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
.wrap{padding:36px 32px}
h1{font-size:38px;margin:0 0 6px}
h1 .fb{color:#1877f2}
.sub{color:#9a9a9a;font-size:19px;margin-bottom:24px;line-height:1.45}
.btn{display:block;width:100%;margin:0 0 14px;padding:20px;background:#161616;border:2px solid transparent;border-radius:16px;color:#e8e8e8;font-size:26px;text-align:left;cursor:pointer;font-family:inherit}
.btn.focused{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,.4);outline:none}
.note{color:#9a9a9a;font-size:16px;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h1><span class="fb">f</span> Facebook</h1>
<div class="sub">Quick links to the mobile site.<br>You will log in the first time.</div>
<button class="btn focusable" data-go="https://m.facebook.com/">&#127968; Feed</button>
<button class="btn focusable" data-go="https://m.facebook.com/notifications">&#128276; Notifications</button>
<button class="btn focusable" data-go="https://m.facebook.com/messages">&#9993; Messages</button>
<button class="btn focusable" data-go="https://m.facebook.com/marketplace">&#127978; Marketplace</button>
<button class="btn focusable" data-go="https://m.facebook.com/watch">&#9654; Watch</button>
<div class="note">ESC goes back to your apps.<br>These are Facebook's real pages, not redesigned for glasses, so some screens may feel cramped.</div>
</div>
<script>
var items=[...document.querySelectorAll('.focusable')],i=0;
function f(n){i=(n+items.length)%items.length;items.forEach(function(el,k){el.classList.toggle('focused',k===i)});items[i].focus({preventScroll:true});}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){history.back();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();f(i+1);}
  else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();f(i-1);}
  else if(e.key==='Enter'){e.preventDefault();items[i].click();}
});
items.forEach(function(b){b.addEventListener('click',function(){location.href=b.dataset.go;});});
f(0);
</script>
</body>
</html>
